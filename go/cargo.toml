[package]
name = "terminal-server"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.0"
reqwest = { version = "0.11", features = ["json"] }
axum = "0.7"
chrono = { version = "0.4", features = ["serde"] }